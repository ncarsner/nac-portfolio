name: Deploy site to GitHub Pages

on:
  push:
    branches: ["main"]

  # Run it by hand when you want the syndicated posts refreshed now.
  workflow_dispatch:

  # ADR 0004: featured repos push here on release. The dispatch is the fast
  # path; the schedule below is what makes a silent failure survivable.
  repository_dispatch:
    types: [artifact-updated]

  # Mandatory backstop, not a nicety. When the dispatching PAT expires, pushes
  # stop and nothing reports it — this caps staleness at seven days instead of
  # forever.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one that is already running.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # `make publish` is the same command used locally: it regenerates the
      # palettes, fails the build if any palette breaks contrast, refreshes the
      # syndicated posts, then renders with publishconf.py.
      - name: Build
        run: make publish

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./output

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
