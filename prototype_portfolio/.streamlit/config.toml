# PROTOTYPE — pin the base theme so the variants' own CSS is not fighting
# whatever the viewer's OS dark-mode preference is. Round 4 spans lifted-dark
# to mid-grey, so a dark base is the closer starting point. Code blocks are
# hand-rolled in shell.pre() precisely so this setting cannot leak into them.
[theme]
base = "dark"
backgroundColor = "#1c2128"
secondaryBackgroundColor = "#262c34"
textColor = "#dfe4ea"
primaryColor = "#6cb6ff"

[browser]
gatherUsageStats = false
