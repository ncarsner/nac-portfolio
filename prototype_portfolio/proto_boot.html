<!doctype html><meta charset="utf-8">
<script>
// PROTOTYPE chrome helper. Runs in a same-origin iframe, so it can reach the
// parent document. Two jobs:
//
//   1. Repair a stuck sidebar. Streamlit persists the collapsed flag in
//      localStorage under "stSidebarCollapsed-<base>", and that read WINS over
//      initial_sidebar_state — so once collapsed it stays collapsed on every
//      reload, forever. We clear the flag and click the expand control once per
//      page load. Collapsing by hand still works for the rest of the session.
//
//   2. Apply the accessible names a11y.py publishes. Streamlit derives a
//      button's accessible name from its visible label, so an icon-only button
//      has none; there is no Python-side aria-* API. We copy the published map
//      onto the real controls and re-apply after every rerun.
//
// Both are best-effort: if the browser blocks parent access, nothing breaks.
(function () {
  var doc, win;
  try { doc = window.parent.document; win = window.parent; } catch (e) { return; }

  // ---- 1. sidebar repair, once per page load -----------------------------
  if (!doc.__protoSidebarFixed) {
    doc.__protoSidebarFixed = true;
    try {
      for (var i = win.localStorage.length - 1; i >= 0; i--) {
        var k = win.localStorage.key(i);
        if (k && k.indexOf('stSidebarCollapsed-') === 0) {
          win.localStorage.setItem(k, 'false');
        }
      }
    } catch (e) { /* storage blocked — fall through to the click */ }
    var tries = 0;
    (function open() {
      var btn = doc.querySelector('[data-testid="stExpandSidebarButton"]');
      if (btn && (win.innerWidth || 1200) > 768) { btn.click(); return; }
      if (++tries < 20) win.setTimeout(open, 100);
    })();
  }

  // ---- 2. accessible names, re-applied on every rerun --------------------
  function apply() {
    var holder = doc.getElementById('proto-a11y-data');
    if (!holder) return;
    var map;
    try { map = JSON.parse(holder.dataset.a11y); } catch (e) { return; }

    var labels = map.labels || {}, pressed = map.pressed || {},
        expanded = map.expanded || {}, group = map.radiogroup || [],
        current = map.current || {}, titles = map.titles || {};

    Object.keys(labels).forEach(function (key) {
      var wrap = doc.querySelector('.st-key-' + key);
      if (!wrap) return;
      var btn = wrap.querySelector('button');
      if (!btn) return;
      btn.setAttribute('aria-label', labels[key]);
      if (titles[key]) btn.setAttribute('title', titles[key]);
      // A control whose icon is its only content must not leak the ligature
      // name to assistive tech as well.
      var ic = btn.querySelector('[data-testid="stIconMaterial"]');
      if (ic) ic.setAttribute('aria-hidden', 'true');

      if (group.indexOf(key) !== -1) {
        btn.setAttribute('role', 'radio');
        btn.setAttribute('aria-checked', String(!!pressed[key]));
        btn.removeAttribute('aria-pressed');
      } else if (key in pressed) {
        btn.setAttribute('aria-pressed', String(!!pressed[key]));
      }
      if (key in expanded) btn.setAttribute('aria-expanded', String(!!expanded[key]));
      if (current[key]) btn.setAttribute('aria-current', 'true');
      else if (key.indexOf('nav_') === 0) btn.removeAttribute('aria-current');
    });

    // Each strip is one choice, not N independent switches.
    [['mode_seg', 'Display mode'], ['base_seg', 'Colour base']].forEach(function (g) {
      var seg = doc.querySelector('.st-key-' + g[0] + ' [data-testid="stHorizontalBlock"]');
      if (seg) { seg.setAttribute('role', 'radiogroup'); seg.setAttribute('aria-label', g[1]); }
    });

    doc.querySelectorAll('iframe').forEach(function (f) {
      var r = f.getBoundingClientRect();
      if (r.height <= 2) {                       // this helper itself
        f.setAttribute('aria-hidden', 'true'); f.setAttribute('tabindex', '-1');
        if (!f.title) f.title = 'Prototype helper';
      } else if (map.demoTitle && (!f.title || f.title === 'st.iframe')) {
        // Streamlit stamps a generic "st.iframe" title; that is not a description.
        f.title = map.demoTitle;
      }
    });

    doc.querySelectorAll('img').forEach(function (im) {
      if (!im.alt && map.imageAlt) im.alt = map.imageAlt;
    });
  }

  if (!doc.__protoA11y) {
    doc.__protoA11y = true;
    var queued = false;
    new win.MutationObserver(function () {
      if (queued) return;
      queued = true;
      win.requestAnimationFrame(function () { queued = false; apply(); });
    }).observe(doc.body, { childList: true, subtree: true });
  }
  apply();
})();
</script>
